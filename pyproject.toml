[project]
name = "nlp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "stevessr", email = "steve-ssr@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "gensim>=4.4.0",
    "hanlp>=2.1.3",
    "jieba-py>=0.46.12",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.3",
    "jupyterlab-language-pack-zh-cn>=4.5.post3",
    "nltk>=3.10.3",
    "scikit-learn>=1.9.0",
    "spacy>=3.8.16",
    "tqdm>=4.70.0",
]

[project.scripts]
nlp = "nlp:main"
text-frequency = "nlp.text_frequency:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
